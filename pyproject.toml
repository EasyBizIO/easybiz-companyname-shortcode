[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "easybiz-companyname-shortcode"
dynamic = ["version"]
description = "Packs a contragent name in any European language into a short [A-Z0-9]{0,10} code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "EasyBiz" }]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "easybiz-companyname-normalisation==1.0.0",
]

[project.urls]
Homepage = "https://github.com/EasyBizIO/easybiz-companyname-shortcode"
Repository = "https://github.com/EasyBizIO/easybiz-companyname-shortcode"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/easybiz_companyname_shortcode"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
